        <p>Systems engineer at Cloudflare. I build things from scratch to understand them.</p>
        <h2 style="font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.25rem;">I. One hour a day.</h2>
        <p>Computer time was rationed to an hour a day. At 15 I taught myself C and x86 assembly and wrote Aqeous, an SMP operating system, mostly from a smartphone.</p>
        <h2 style="font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.25rem;">II. Then I learned to break things.</h2>
        <p>GreyFang, a two-person CTF team, climbed to #7 in India and won the Nullcon Goa hardware CTF in 2022.</p>
        <h2 style="font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.25rem;">III. Research is an infrastructure problem.</h2>
        <p>TPU training pipelines at HyperVerge, then Hive, the distributed WebRTC SFU I built as a founding engineer at Dyte, later acquired by Cloudflare.</p>
        <h2 style="font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.25rem;">IV. Order, out of noise.</h2>
        <p>FlaxDiff and Dew: diffusion and language models trained on 128 TPUv4 chips.</p>
        <h2 style="font-family: system-ui, sans-serif; font-weight: 400; font-size: 1.25rem;">V. Machines that keep working while you sleep.</h2>
        <p>VibeSDK and Cloudflare OS at Cloudflare, and Kinu on my own time.</p>
