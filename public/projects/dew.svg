    <text x="178" y="148" font-size="54" font-weight="600" fill="#eef4fa" letter-spacing="-1.5">dew</text>
    <text x="310" y="148" font-size="22" fill="#8fa3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dewml.dev</text>
    <text x="1480" y="148" font-size="22" fill="#8fa3b8" text-anchor="end">one JAX codebase · three model families · any mesh</text>

    <g>
