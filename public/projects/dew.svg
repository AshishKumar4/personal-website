        <rect x="1092" y="354" width="120" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="1152" y="384" text-anchor="middle">I-JEPA</text>
        <rect x="1226" y="354" width="120" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="1286" y="384" text-anchor="middle">V-JEPA</text>
      </g>
      <g stroke="#e6c38f" stroke-opacity="0.7" fill="none">
        <rect x="1092" y="420" width="40" height="40" rx="4" fill="#e6c38f" fill-opacity="0.12"/>
        <rect x="1140" y="420" width="40" height="40" rx="4" stroke-dasharray="4 4"/>
        <rect x="1188" y="420" width="40" height="40" rx="4" fill="#e6c38f" fill-opacity="0.12"/>
        <rect x="1236" y="420" width="40" height="40" rx="4" stroke-dasharray="4 4"/>
