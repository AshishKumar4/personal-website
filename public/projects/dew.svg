    <circle cx="800" cy="640" r="5" fill="#8cc8f0"/>

    <rect x="110" y="660" width="1380" height="270" rx="18" fill="#0d141c" stroke="#2a3a4c"/>
    <text x="142" y="712" font-size="15" fill="#8fa3b8" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ONE TRAINER · JAX / FLAX</text>
    <text x="142" y="758" font-size="34" font-weight="600" fill="#eef4fa" letter-spacing="-0.8">Sharded across the device mesh</text>
    <g font-size="20" fill="#c9d6e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="142" y="800" width="112" height="46" rx="23" fill="#122232" stroke="#3b6b90"/>
      <text x="198" y="830" text-anchor="middle">FSDP</text>
