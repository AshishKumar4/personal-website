      <rect x="408" y="800" width="126" height="46" rx="23" fill="#122232" stroke="#3b6b90"/>
      <text x="471" y="830" text-anchor="middle">tensor</text>
      <rect x="548" y="800" width="146" height="46" rx="23" fill="#122232" stroke="#3b6b90"/>
      <text x="621" y="830" text-anchor="middle">sequence</text>
