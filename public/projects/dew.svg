      </g>
      <g fill="#e6c38f" fill-opacity="0.2" stroke="#e6c38f" stroke-opacity="0.7">
        <rect x="384" y="104" width="52" height="40" rx="6"/><rect x="448" y="104" width="52" height="40" rx="6"/><rect x="384" y="156" width="52" height="40" rx="6"/><rect x="448" y="156" width="52" height="40" rx="6"/>
