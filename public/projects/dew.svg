        <rect x="0" y="0" width="52" height="40" rx="6"/><rect x="64" y="0" width="52" height="40" rx="6"/><rect x="128" y="0" width="52" height="40" rx="6"/><rect x="192" y="0" width="52" height="40" rx="6"/><rect x="256" y="0" width="52" height="40" rx="6"/><rect x="320" y="0" width="52" height="40" rx="6"/><rect x="384" y="0" width="52" height="40" rx="6"/><rect x="448" y="0" width="52" height="40" rx="6"/>
        <rect x="0" y="52" width="52" height="40" rx="6"/><rect x="64" y="52" width="52" height="40" rx="6"/><rect x="128" y="52" width="52" height="40" rx="6"/><rect x="192" y="52" width="52" height="40" rx="6"/><rect x="256" y="52" width="52" height="40" rx="6"/><rect x="320" y="52" width="52" height="40" rx="6"/><rect x="384" y="52" width="52" height="40" rx="6"/><rect x="448" y="52" width="52" height="40" rx="6"/>
        <rect x="0" y="104" width="52" height="40" rx="6"/><rect x="64" y="104" width="52" height="40" rx="6"/><rect x="128" y="104" width="52" height="40" rx="6"/><rect x="192" y="104" width="52" height="40" rx="6"/><rect x="256" y="104" width="52" height="40" rx="6"/><rect x="320" y="104" width="52" height="40" rx="6"/><rect x="384" y="104" width="52" height="40" rx="6"/><rect x="448" y="104" width="52" height="40" rx="6"/>
        <rect x="0" y="156" width="52" height="40" rx="6"/><rect x="64" y="156" width="52" height="40" rx="6"/><rect x="128" y="156" width="52" height="40" rx="6"/><rect x="192" y="156" width="52" height="40" rx="6"/><rect x="256" y="156" width="52" height="40" rx="6"/><rect x="320" y="156" width="52" height="40" rx="6"/><rect x="384" y="156" width="52" height="40" rx="6"/><rect x="448" y="156" width="52" height="40" rx="6"/>
      </g>
      <g fill="#7fb8e6" fill-opacity="0.28" stroke="#7fb8e6" stroke-opacity="0.8">
        <rect x="0" y="0" width="52" height="40" rx="6"/><rect x="64" y="0" width="52" height="40" rx="6"/><rect x="128" y="0" width="52" height="40" rx="6"/><rect x="192" y="0" width="52" height="40" rx="6"/>
      </g>
      <g fill="#9fd8c4" fill-opacity="0.22" stroke="#9fd8c4" stroke-opacity="0.7">
