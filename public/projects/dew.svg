      <text x="142" y="272" font-size="15" fill="#7fb8e6" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 · LANGUAGE</text>
      <text x="142" y="318" font-size="34" font-weight="600" fill="#eef4fa" letter-spacing="-0.8">Language models</text>
      <g font-size="20" fill="#c9d6e3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
        <rect x="142" y="354" width="150" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="217" y="384" text-anchor="middle">pretrain</text>
        <rect x="306" y="354" width="100" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="356" y="384" text-anchor="middle">SFT</text>
        <rect x="142" y="414" width="100" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="192" y="444" text-anchor="middle">DPO</text>
        <rect x="256" y="414" width="112" height="46" rx="10" fill="#15222f" stroke="#2a3a4c"/>
        <text x="312" y="444" text-anchor="middle">GRPO</text>
